name: ComputePulse CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    - name: Install Frontend dependencies
      run: |
        cd Frontend
        npm install


    - name: Build Frontend
      run: |
        cd Frontend
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Backend Warmup / Health
      run: |
        # Quick validation of python modules and code correctness
        python -c "from api.main import app; print('Backend loaded successfully')"

    - name: Build Docker Image
      run: |
        docker build -t computepulse:latest .
